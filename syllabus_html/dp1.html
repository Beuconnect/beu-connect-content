<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikash Kumar - Backend Developer</title>
    <link rel="stylesheet" href="app_browser.css">
    <style>
        .profile-card {
            text-align: center;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid var(--accent-cyan);
            margin: 0 auto 20px;
            display: block;
            box-shadow: 0 0 20px rgba(24, 216, 255, 0.3);
            object-fit: cover;
        }
        .dev-name {
            font-size: 24px;
            font-weight: 800;
            color: #FFFFFF;
            margin: 10px 0 5px;
        }
        .dev-role {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-cyan);
            margin-bottom: 15px;
        }
        .dev-details {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <img src="dp1.png" alt="Vikash Kumar" class="profile-img">
            <div class="dev-name">Vikash Kumar</div>
            <div class="dev-role">Backend Developer</div>
            <div class="dev-details">
                Computer Science & Eng. (Batch 2023–2027)<br>
                Government Engineering College, Banka
            </div>
        </div>
        <div class="footer">BEU Connect Development Team</div>
    </div>
</body>
</html>
