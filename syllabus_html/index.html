<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEU Connect - Premium Academic Portal</title>
    <link rel="stylesheet" href="app_browser.css">
    <style>
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 24px;
        }
        .portal-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: 16px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .portal-item:hover {
            background: rgba(24, 216, 255, 0.1);
            border-color: var(--accent-cyan);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .portal-icon {
            font-size: 24px;
            margin-bottom: 8px;
            display: block;
        }
        .portal-label {
            font-size: 12px;
            font-weight: 700;
            color: #FFFFFF;
        }
        .hero {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #13263D 0%, #0D1B2A 100%);
            border-radius: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--card-border);
        }
        .hero h1 { margin: 0; font-size: 32px; }
        .hero p { color: var(--text-secondary); margin-top: 8px; }
    </style>
</head>

    <div class="container">

        </div>

            <a href="ME.html" class="portal-item"><span class="portal-icon">⚙️</span><span class="portal-label">ME</span></a>
